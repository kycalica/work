name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
      - name: Shell syntax and lint
        run: |
          for f in tools/*.sh; do bash -n "$f"; done
          shellcheck -x -e SC1091 tools/*.sh
